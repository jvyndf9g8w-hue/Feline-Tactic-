<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Féline 31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Féline 31 – Tableau tactique</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto;padding:14px 12px 26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}.top h1{font-size:18px;margin:0;font-weight:800}.top button,.toolbar button{border:1px solid #657080;background:#10151e;color:white;border-radius:10px;padding:9px 13px;font-size:14px;font-weight:650;min-height:40px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.toolbar button.active{background:#176d37;border-color:#45c76c}
#court{width:100%;aspect-ratio:371/386;position:relative;overflow:hidden;border-radius:11px;background:#155eea;touch-action:none}
#court svg.pitch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.token{position:absolute;width:152px;height:168px;transform:translate(-50%,-50%);touch-action:none;user-select:none;-webkit-user-select:none;z-index:2}
.token svg{width:100%;height:100%;overflow:visible;display:block;pointer-events:none;transform-origin:50% 50%}
.token .art{position:absolute;inset:0;transform-origin:50% 50%;pointer-events:none}
.token .art img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
.token-label{position:absolute;left:52%;top:34%;transform:translate(-50%,-50%);font-size:20px;font-weight:900;line-height:1;text-align:center;white-space:nowrap;text-shadow:0 0 1px rgba(255,255,255,.25)}

.token.selected{z-index:8}
.token.selected:after{content:"";position:absolute;inset:3px 4px;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none}
.handle{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:white;border:3px solid #155eea;box-shadow:0 1px 5px #111;display:none;touch-action:none;z-index:10}
.token.selected .handle{display:block}
#ball{position:absolute;width:19px;height:19px;border-radius:50%;background:#dfff00;border:2px solid #fff;box-shadow:0 0 8px #dfff00;transform:translate(-50%,-50%);touch-action:none;z-index:4}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:#e5e8ef;margin:9px 2px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px}
.hint{font-size:12px;color:#aab0ba;line-height:1.4;margin:8px 2px}
</style>
</head>
<body>
<main>
 <div class="top"><h1>Défense 0-6 · Attaque placée</h1><button id="reset">↶ Réinitialiser</button></div>
 <div class="toolbar"><button id="move" class="active">Déplacement</button><button id="deselect">Désélectionner</button></div>
 <div id="court" aria-label="Terrain tactique Féline 31">
  <svg class="pitch" viewBox="0 0 371 386" preserveAspectRatio="none">
   <defs><clipPath id="courtClip"><rect x="10" y="35" width="351" height="351"/></clipPath></defs>
   <rect width="371" height="298" fill="#155eea"/>
   <!-- Bande bleue hors terrain : elle accueille la cage et abaisse visuellement sa position -->
   <rect x="10" y="0" width="351" height="35" fill="#155eea"/>
   <g clip-path="url(#courtClip)">
    <path d="M80.2 35 A105.3 105.3 0 0 0 290.8 35" fill="none" stroke="white" stroke-width="2.5"/>
    <path d="M27.55 35 A157.95 157.95 0 0 0 343.45 35" fill="none" stroke="white" stroke-width="2.5" stroke-dasharray="7 7"/>
   </g>
   <!-- Limites du demi-terrain : 20 m × 20 m, dessinés à l'échelle -->
   <path d="M10 35 H361 V386 H10Z" fill="none" stroke="white" stroke-width="2.5"/>

   <g id="handball-goal">
    <rect x="159.175" y="0" width="52.65" height="35" fill="#155eea" stroke="#ed1680" stroke-width="2.8"/>
    <path d="M159.175 0 H211.825 M159.175 0 V35 M211.825 0 V35" fill="none" stroke="#ed1680" stroke-width="2.8"/>
    <path d="M164.5 2 V33 M170 2 V33 M175.5 2 V33 M181 2 V33 M186.5 2 V33 M192 2 V33 M197.5 2 V33 M203 2 V33 M208.5 2 V33 M160 6 H211 M160 12 H211 M160 18 H211 M160 24 H211 M160 30 H211" fill="none" stroke="white" stroke-width="0.65" opacity=".98"/>
   </g>
   <!-- Repères réglementaires depuis la ligne de but : 4 m = 15 cm ; 7 m = 1 m -->
   <path d="M184.18 105.2 H186.82" stroke="white" stroke-width="2.5" stroke-linecap="butt"/>
   <path d="M176.725 157.85 H194.275" stroke="white" stroke-width="2.5" stroke-linecap="butt"/>
  </svg>
 </div>
 <div class="legend"><span><i class="dot" style="background:#08d52c"></i>1 à 7</span><span><i class="dot" style="background:#ed3030"></i>ALG · ALD · PIV · ARG · DC · ARD</span><span><i class="dot" style="background:#ed3030"></i>G</span></div>
 <p class="hint">Verts : défense 0-6 (6 joueuses). Rouges : attaque placée avec ALG, ARG, DC, ARD, ALD et pivot entre les défenseurs 2 et 3. Glisse les joueurs pour ajuster le placement ; sélectionne un joueur pour tourner la poignée.</p>
</main>

function create(){
 court.querySelectorAll('.token,#ball').forEach(n=>n.remove());players=[];
 initial.forEach(d=>{
  const p={x:d[0],y:oldToNewY(d[1]),angle:d[2],team:d[3],label:d[4]};
  const el=document.createElement('div');el.className='token';el.innerHTML=svgToken(p)+'<div class="handle" aria-label="Poignée de rotation"></div>';court.append(el);
  p.el=el;p.art=el.querySelector('.art');p.handle=el.querySelector('.handle');players.push(p);
  el.addEventListener('pointerdown',e=>{if(e.target===p.handle)return;start(e,p,'move');});
  p.handle.addEventListener('pointerdown',e=>start(e,p,'rotate'));
 });
 const b=document.createElement('div');b.id='ball';court.append(b);ball.el=b;
 b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();selected=null;drag={type:'ball'};b.setPointerCapture(e.pointerId);render();});
 render();
}
function start(e,p,type){e.preventDefault();e.stopPropagation();selected=p;drag={type,p};p.el.setPointerCapture(e.pointerId);render();}
function render(){players.forEach(p=>{p.el.style.left=p.x/371*100+'%';p.el.style.top=p.y/386*100+'%';p.art.style.transform=`rotate(${p.angle}deg)`;p.el.classList.toggle('selected',selected===p);});ball.el.style.left=ball.x/371*100+'%';ball.el.style.top=ball.y/386*100+'%';}
court.addEventListener('pointermove',e=>{if(!drag)return;const q=point(e);if(drag.type==='move'){drag.p.x=Math.max(12,Math.min(359,q.x));drag.p.y=Math.max(12,Math.min(382,q.y));}else if(drag.type==='rotate'){drag.p.angle=Math.atan2(q.y-drag.p.y,q.x-drag.p.x)*180/Math.PI;}else{ball.x=Math.max(8,Math.min(363,q.x));ball.y=Math.max(8,Math.min(384,q.y));}render();});
court.addEventListener('pointerup',()=>drag=null);court.addEventListener('pointercancel',()=>drag=null);
document.getElementById('reset').onclick=()=>{selected=null;ball.x=63;ball.y=oldToNewY(250);create();};
document.getElementById('deselect').onclick=()=>{selected=null;render();};
create();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
