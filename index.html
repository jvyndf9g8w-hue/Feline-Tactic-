<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Féline 31">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Féline 31 – Tableau tactique</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1100px;margin:auto;padding:14px 12px 26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}.top h1{font-size:18px;margin:0;font-weight:800}.top button,.toolbar button{border:1px solid #657080;background:#10151e;color:white;border-radius:10px;padding:9px 13px;font-size:14px;font-weight:650;min-height:40px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.toolbar button.active{background:#176d37;border-color:#45c76c}
#court{width:100%;aspect-ratio:371/263;position:relative;overflow:hidden;border-radius:11px;background:#155eea;touch-action:none}
#court svg.pitch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.token{position:absolute;width:68px;height:82px;transform:translate(-50%,-50%);touch-action:none;user-select:none;-webkit-user-select:none;z-index:2}
.token svg{width:100%;height:100%;overflow:visible;display:block;pointer-events:none;transform-origin:50% 50%}
.token.selected{z-index:8}
.token.selected:after{content:"";position:absolute;inset:3px 4px;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none}
.handle{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:25px;height:25px;border-radius:50%;background:white;border:3px solid #155eea;box-shadow:0 1px 5px #111;display:none;touch-action:none;z-index:10}
.token.selected .handle{display:block}
#ball{position:absolute;width:19px;height:19px;border-radius:50%;background:#ff7900;border:2px solid white;transform:translate(-50%,-50%);touch-action:none;z-index:4}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:#e5e8ef;margin:9px 2px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px}
.hint{font-size:12px;color:#aab0ba;line-height:1.4;margin:8px 2px}
</style>
</head>
<body>
<main>
 <div class="top"><h1>Déplacement et orientation à 360°</h1><button id="reset">↶ Réinitialiser</button></div>
 <div class="toolbar"><button id="move" class="active">Déplacement</button><button id="deselect">Désélectionner</button></div>
 <div id="court" aria-label="Terrain tactique Féline 31">
  <svg class="pitch" viewBox="0 0 371 263" preserveAspectRatio="none">
   <rect width="371" height="263" fill="#155eea"/>
   <path d="M42 0 H329 A0 0 0 0 1 329 0 C325 58 264 91 185.5 91 C107 91 46 58 42 0Z" fill="#ed1680"/>
   <path d="M42 0 C46 58 107 91 185.5 91 C264 91 325 58 329 0" fill="none" stroke="white" stroke-width="2.5"/>
   <path d="M10 9 H361 V254 H10Z" fill="none" stroke="white" stroke-width="2.5"/>
   <path d="M10 42 C24 116 87 139 185.5 139 C284 139 347 116 361 42" fill="none" stroke="white" stroke-width="2.5" stroke-dasharray="7 7"/>
   <path d="M172 29 H194 M172 99 H194" stroke="white" stroke-width="4"/>
  </svg>
 </div>
 <div class="legend"><span><i class="dot" style="background:#08d52c"></i>1 à 7</span><span><i class="dot" style="background:#ffe000"></i>ALG · ALD · PIV · ARG · DC · ARD</span><span><i class="dot" style="background:#ed3030"></i>G</span></div>
 <p class="hint">Glisse le joueur pour le déplacer. Sélectionne-le pour faire apparaître la poignée blanche, puis tourne-la avec ton doigt pour changer son orientation.</p>
</main>
<script>
(()=>{
const court=document.getElementById('court');
const initial=[
[43,153,0,'g','1'],[94,180,0,'g','2'],[140,207,0,'g','3'],[188,230,0,'g','4'],[232,207,0,'g','5'],[276,180,0,'g','6'],[328,153,0,'g','7'],
[55,130,0,'y','ALG'],[110,151,0,'y','ARG'],[161,169,0,'y','DC'],[260,169,0,'y','ARD'],[314,130,0,'y','ALD'],[186,202,0,'y','PIV'],
[185,8,180,'r','G']
];
const palette={g:{fill:'#08d52c',stroke:'#078c20',ink:'#063b12'},y:{fill:'#ffe000',stroke:'#b28c00',ink:'#392c00'},r:{fill:'#ed3030',stroke:'#a40e16',ink:'#fff'}};
let players=[],selected=null,drag=null,ball={x:63,y:224,el:null};
function point(e){const r=court.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*371,y:(e.clientY-r.top)/r.height*263};}
function svgToken(p){
 const col=palette[p.team];
 return `<svg viewBox="0 0 80 100" aria-hidden="true">
 <g class="art">
  <path d="M7 29 C16 9 39 2 58 12 C78 22 76 44 64 63 C56 77 43 91 27 98 C36 77 42 59 34 45 C27 33 15 30 7 29Z" fill="${col.fill}" stroke="${col.stroke}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M8 29 C22 16 39 16 51 23 C40 20 26 26 20 37" fill="none" stroke="${col.stroke}" stroke-width="3" stroke-linecap="round"/>
  <circle cx="55" cy="28" r="15" fill="${col.fill}" stroke="${col.stroke}" stroke-width="3"/>
  <text x="55" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="${p.label.length>2?8:12}" font-weight="900" fill="${col.ink}">${p.label}</text>
 </g></svg>`;
}
function create(){
 court.querySelectorAll('.token,#ball').forEach(n=>n.remove());players=[];
 initial.forEach(d=>{
  const p={x:d[0],y:d[1],angle:d[2],team:d[3],label:d[4]};
  const el=document.createElement('div');el.className='token';el.innerHTML=svgToken(p)+'<div class="handle" aria-label="Poignée de rotation"></div>';court.append(el);
  p.el=el;p.art=el.querySelector('svg');p.handle=el.querySelector('.handle');players.push(p);
  el.addEventListener('pointerdown',e=>{if(e.target===p.handle)return;start(e,p,'move');});
  p.handle.addEventListener('pointerdown',e=>start(e,p,'rotate'));
 });
 const b=document.createElement('div');b.id='ball';court.append(b);ball.el=b;
 b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();selected=null;drag={type:'ball'};b.setPointerCapture(e.pointerId);render();});
 render();
}
function start(e,p,type){e.preventDefault();e.stopPropagation();selected=p;drag={type,p};p.el.setPointerCapture(e.pointerId);render();}
function render(){players.forEach(p=>{p.el.style.left=p.x/371*100+'%';p.el.style.top=p.y/263*100+'%';p.art.style.transform=`rotate(${p.angle}deg)`;p.el.classList.toggle('selected',selected===p);});ball.el.style.left=ball.x/371*100+'%';ball.el.style.top=ball.y/263*100+'%';}
court.addEventListener('pointermove',e=>{if(!drag)return;const q=point(e);if(drag.type==='move'){drag.p.x=Math.max(12,Math.min(359,q.x));drag.p.y=Math.max(12,Math.min(251,q.y));}else if(drag.type==='rotate'){drag.p.angle=Math.atan2(q.y-drag.p.y,q.x-drag.p.x)*180/Math.PI;}else{ball.x=Math.max(8,Math.min(363,q.x));ball.y=Math.max(8,Math.min(255,q.y));}render();});
court.addEventListener('pointerup',()=>drag=null);court.addEventListener('pointercancel',()=>drag=null);
document.getElementById('reset').onclick=()=>{selected=null;ball.x=63;ball.y=224;create();};
document.getElementById('deselect').onclick=()=>{selected=null;render();};
create();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
